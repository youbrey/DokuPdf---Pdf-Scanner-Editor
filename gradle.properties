# =============================================================
# DokuPdf — gradle.properties
# Status: BARU (Tahap 8) — file ini TIDAK PERNAH ADA sejak skeleton Tahap 1,
# padahal seluruh dependency proyek (Compose, Room, Hilt, CameraX, ML Kit, dll.)
# adalah library AndroidX. Ini baru terlihat sebagai BUILD FAILED nyata saat
# CI (Tahap 7) pertama kali dijalankan — bukan sesuatu yang bisa dideteksi
# lewat pembacaan kode/audit statis sebelumnya, karena Gradle memvalidasinya
# di tahap resolusi dependency, bukan saat konfigurasi file ini sendiri absen.
#
# Root cause build gagal (task :app:checkDebugAarMetadata):
#   "Configuration `:app:debugRuntimeClasspath` contains AndroidX dependencies,
#   but the `android.useAndroidX` property is not enabled" — AGP menolak build
#   kalau ada dependency AndroidX tapi flag ini belum diset true secara eksplisit.
# =============================================================

# WAJIB — root cause build failed Tahap 8. Tanpa ini, checkDebugAarMetadata
# gagal untuk SEMUA dependency AndroidX (Compose, Room, Hilt, CameraX, dst.).
android.useAndroidX=true

# Rekomendasi standar berpasangan dengan useAndroidX — mencegah R class digenerate
# transitif dari semua dependency (build lebih cepat, konsisten dengan Compose/AGP modern).
# Belum diuji apakah ada kode yang diam-diam bergantung pada R class transitif
# (kecil kemungkinan karena proyek masih skeleton/awal) — TODO 🟡 di bawah.
android.nonTransitiveRClass=true

# Kotlin code style resmi (bukan bug fix, tapi standar yang seharusnya sudah ada
# sejak awal proyek Kotlin dibuat — ditambahkan sekalian di sini).
kotlin.code.style=official

# Heap JVM untuk proses daemon Gradle — default terlalu kecil untuk build Compose +
# Room (KSP) + Hilt (KSP) berjalan bersamaan, terutama di runner CI dengan resource terbatas.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

